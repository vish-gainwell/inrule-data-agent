[project]
name = "inrules-data-agent"
version = "0.2.0"
description = "InRule data agent for pharmacy claim-edit schema and query workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.0",
    "pandas>=2.3.0",
    "openpyxl>=3.1.0",
    "PyYAML>=6.0.0",
    "httpx>=0.28.0",
    "pyodbc>=5.3.0",
    "openai>=2.44.0",
    "sqlglot>=30.12.0",
    "qdrant-client>=1.15,<1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inrules_data_agent"]

[tool.poe.tasks]
test = "python -m pytest tests -v"
test-fast = "python -m pytest tests/test_generate_queries.py tests/test_querytext_shadow.py -v"
test-query-generation = "python -m pytest tests/test_generate_queries.py -v"
test-query-reuse = "python -m pytest tests/test_dataquery_catalog.py tests/test_querytext_shadow.py -v"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=8.4.0",
]
