        workbook: DataQuery_EVAL_072926.xlsx
        reference: Data Queries!Q161:R161
        excerpt: GT Query validates DOS between EFF and Term dates.
      corroboration:
        workbook: IL_DataQuery_GroundTruth_08042026.xlsx
        reference: Sheet1!V160
  - id: approved-reject-code-dos-validity
    version: "1.0.0"
    applies_when:
      required_phrases:
        - other payer reject codes
        - approved
        - reject code list
      provenance:
        workbook: DataQuery_EVAL_072926.xlsx
        references: [Edit Review!N35:O35, Data Queries!H119, Data Queries!L119]
    semantic_hint:
      missing_detail: "Only approved reject-code entries effective on the claim’s date of service are valid."
      provenance:
        workbook: DataQuery_EVAL_072926.xlsx
        reference: Data Queries!Q119:R119
        excerpt: GT Query validates DOS between EFF and Term dates.
      corroboration:
        workbook: IL_DataQuery_GroundTruth_08042026.xlsx
        references: [Sheet1!P204, Sheet1!V204]
  - id: icd10-four-character-reference-match
    version: "1.0.0"
