schema_version: 1
concepts:
  - id: reject-code-dos-effective-validity
    version: "1.1.2"
    applies_when:
      required_phrases:
        - other payer reject code
        - valid ncpdp reject code
      provenance:
        workbook: DataQuery_EVAL_072926.xlsx
        references: [Edit Review!N42:O42, Rule Steps!K162, Data Queries!H161]
    semantic_hint:
      missing_detail: "When validating the reject-code record, also require the date of service to fall inclusively within that record's effective and term dates."
