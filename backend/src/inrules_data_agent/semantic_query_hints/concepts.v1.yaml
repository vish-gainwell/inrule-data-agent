      required_phrases:
        - diagnosis code
        - icd-10
        - matching
        - reference
      provenance:
        evidence_status: ground_truth_backed
        requires_sme_confirmation: true
        sources:
          - workbook: 131_TEST_for_eval_V1_Review Results (2).xlsx
            references: [Summary!A18, Edit Review - TEST!P92:Q92, Data Qu eries - TEST!I255:J255]
          - workbook: IL_DataQuery_GroundTruth_08042026.xlsx
            references: [Sheet1!P8, Sheet1!V8]
    semantic_hint:
      missing_detail: "When validating an ICD-10 diagnosis code, match using its first four characters rather than requiring exact full-code equality."
      provenance:
        evidence_status: ground_truth_backed
        requires_sme_confirmation: true
        sources:
          - workbook: 131_TEST_for_eval_V1_Review Results (2).xlsx
            references: [Summary!A18, Data Queries - TEST!I255:J255]
